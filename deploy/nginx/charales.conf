# Propuesta de proxy inverso para Charales. PLANTILLA: no se ha probado en un servidor real ni con `nginx -t`.
# Sustituye escuela.example y las rutas. Guía: docs/deployment/PROCEDIMIENTO_PRODUCCION.md.

# Límite por cliente antes de llegar a la API (F5-11). IPv6: cuenta cada dirección, no el /64; el límite por /64 es de la
# API. Ajusta las tasas con tráfico real.
# Con un balanceador delante, $binary_remote_addr sería el balanceador y toda la escuela compartiría estos límites: activa
# set_real_ip_from <balanceador>; real_ip_header X-Forwarded-For; real_ip_recursive on;
limit_req_zone $binary_remote_addr zone=charales_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=charales_api:10m rate=30r/s;
limit_req_status 429;

upstream charales_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name escuela.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on; # nginx 1.25.1 o posterior; antes, «listen 443 ssl http2;»
    server_name escuela.example;

    ssl_certificate     /etc/letsencrypt/live/escuela.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/escuela.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:charales_ssl:10m;
    ssl_session_tickets off;

    root /srv/charales/current/dist/project/browser;
    client_max_body_size 256k;

    # La API confía en este encabezado sólo si esta máquina está en TRUSTED_PROXIES, y lee de derecha a izquierda el primer
    # salto que no sea de confianza: lo que el cliente escriba a la izquierda no cuenta. Se AÑADE para que, con un balanceador
    # delante (también en TRUSTED_PROXIES), se conserve la IP del cliente.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location = /auth/login {
        limit_req zone=charales_auth burst=20 nodelay;
        proxy_pass http://charales_api;
    }
    location = /auth/password-reset/request {
        limit_req zone=charales_auth burst=10 nodelay;
        proxy_pass http://charales_api;
    }
    location = /auth/password-reset/confirm {
        limit_req zone=charales_auth burst=10 nodelay;
        proxy_pass http://charales_api;
    }
    location ~ ^/(api|auth)(/|$) {
        limit_req zone=charales_api burst=60 nodelay;
        proxy_pass http://charales_api;
    }
    # Sólo desde la propia máquina: revela si la base responde.
    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://charales_api;
    }

    # Archivos con huella en el nombre: se pueden guardar mucho tiempo.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        include /etc/nginx/snippets/charales-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # La página de recuperación lleva el token en la URL: no-referrer (en las cabeceras) y sin caché.
    location / {
        include /etc/nginx/snippets/charales-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
