# Cabeceras de seguridad de la aplicación. Se incluye desde cada `location` que sirve archivos: en nginx, un add_header
# dentro de una location anula los del nivel superior. La E2E (e2e/app.e2e.ts) sirve la app con ESTE archivo, así que la
# CSP de aquí es la que se prueba en un navegador real. 'unsafe-inline' en style-src: Angular inserta los estilos de sus
# componentes como <style>; script-src no lo necesita.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
