# La batería del proyecto en cada PR y en main (F5-05). Los mismos comandos que docs/DEVELOPMENT.md.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # Sólo para el MariaDB desechable de este job: no es un secreto ni sirve fuera de él.
  DB_HOST: 127.0.0.1
  DB_PORT: '3306'
  DB_USER: root
  DB_PASSWORD: ci-solo-pruebas
jobs:
  quality:
    name: Calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sh scripts/check-sensitive-files.sh
      - run: npx prettier --check .
      - run: git diff --check "$(git merge-base origin/main HEAD)" HEAD
        if: github.event_name == 'pull_request'
      - run: npm run api:build
      - run: npm run api:typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  tests:
    name: API y Angular
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-solo-pruebas
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Cliente de MariaDB para los scripts de respaldo
        run: |
          printf '[client]\nhost=127.0.0.1\nport=3306\nuser=root\npassword=%s\n' "$DB_PASSWORD" > ~/.my.cnf
          chmod 600 ~/.my.cnf
      - run: npm run api:test
      - run: npx ng test --watch=false
      - run: npm run db:mariadb:test-backup
  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-solo-pruebas
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
