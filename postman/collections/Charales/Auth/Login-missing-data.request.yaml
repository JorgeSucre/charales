$kind: http-request
name: 'POST /auth/login (faltan datos)'
method: POST
url: '{{baseUrl}}/auth/login'
order: 1500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 sin contraseña, sin cookie', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.eql('Correo y contraseña son obligatorios.');
        pm.response.to.not.have.header('Set-Cookie');
      });
