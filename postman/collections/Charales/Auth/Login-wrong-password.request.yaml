$kind: http-request
name: 'POST /auth/login (contraseña incorrecta)'
method: POST
url: '{{baseUrl}}/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{password}}-incorrecta"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('401 con el mensaje genérico, sin cookie', () => {
        pm.response.to.have.status(401);
        pm.expect(pm.response.json().error).to.eql('Correo o contraseña incorrectos.');
        pm.response.to.not.have.header('Set-Cookie');
      });
