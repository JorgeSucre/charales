$kind: http-request
name: 'GET /auth/session (tras logout)'
method: GET
url: '{{baseUrl}}/auth/session'
order: 7000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('401 sin sesión', () => {
        pm.response.to.have.status(401);
        pm.expect(pm.response.json().error).to.eql('Tu sesión no está iniciada o ya expiró. Inicia sesión de nuevo.');
      });
