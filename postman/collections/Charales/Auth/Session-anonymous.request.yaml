$kind: http-request
name: 'GET /auth/session (anónimo)'
method: GET
url: '{{baseUrl}}/auth/session'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('401 sin sesión', () => {
        pm.response.to.have.status(401);
        pm.expect(pm.response.json().error).to.eql('Sesión no iniciada o expirada.');
      });
