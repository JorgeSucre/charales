$kind: http-example
request:
  url: '{{baseUrl}}/auth/login'
  method: POST
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      { "error": "Correo y contraseña son obligatorios." }
