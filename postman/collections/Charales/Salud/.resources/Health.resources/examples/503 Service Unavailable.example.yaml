$kind: http-example
request:
  url: '{{baseUrl}}/health'
  method: GET
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      { "status": "error", "database": "unreachable" }
