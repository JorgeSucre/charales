$kind: http-request
name: 'GET /api/categorias'
method: GET
url: '{{baseUrl}}/api/categorias'
order: 1000
examples: './.resources/Categorias.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('respuesta JSON', () => {
        pm.response.to.have.header('Content-Type');
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
        pm.response.to.be.json;
      });
      pm.test('arreglo de registros de categorias', () => {
        const rows = pm.response.json();
        pm.expect(rows).to.be.an('array').that.is.not.empty;
        rows.forEach((r) => pm.expect(r).to.include.keys('id', 'temporada_id', 'nombre', 'edad_minima', 'edad_maxima', 'activo'));
      });
