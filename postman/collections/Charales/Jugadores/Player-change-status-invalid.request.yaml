$kind: http-request
name: 'POST /api/rpc PlayerService.changeStatus (estatus inválido)'
description: '`ELIMINADO` no es un valor de `jugadores.estatus` (T1): 400 y no se escribe nada.'
method: POST
url: '{{baseUrl}}/api/rpc'
order: 6800
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "service": "PlayerService", "method": "changeStatus", "args": [{{playerId}}, "ELIMINADO", "No existe"] }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400: estatus inválido', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.eql('Estatus inválido.');
      });
