$kind: http-request
name: 'GET /api/jugadores'
method: GET
url: '{{baseUrl}}/api/jugadores'
order: 5000
examples: './.resources/Jugadores.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('respuesta JSON', () => {
        pm.response.to.have.header('Content-Type');
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
        pm.response.to.be.json;
      });
      pm.test('arreglo de registros de jugadores', () => {
        const rows = pm.response.json();
        pm.expect(rows).to.be.an('array').that.is.not.empty;
        rows.forEach((r) => pm.expect(r).to.include.keys('id', 'identificador', 'nombre', 'apellido_paterno', 'fecha_nacimiento', 'estatus'));
      });
