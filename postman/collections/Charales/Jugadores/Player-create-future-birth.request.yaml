$kind: http-request
name: 'POST /api/rpc PlayerService.create (fecha de nacimiento futura)'
description: '`futureBirthDate` (hoy + 1 año) la calcula el script previo de PlayerService.create.'
method: POST
url: '{{baseUrl}}/api/rpc'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "service": "PlayerService",
      "method": "create",
      "args": [{
        "firstName": "Futuro",
        "lastName1": "Postman",
        "lastName2": "{{playerTag}}",
        "birthDate": "{{futureBirthDate}}",
        "sex": "F",
        "phone": null,
        "email": null,
        "address": null
      }]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400: la fecha de nacimiento no puede ser futura', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.eql('La fecha de nacimiento no puede ser futura.');
      });
