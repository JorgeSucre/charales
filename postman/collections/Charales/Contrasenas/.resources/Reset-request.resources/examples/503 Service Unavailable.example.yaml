$kind: http-example
request:
  url: '{{baseUrl}}/auth/password-reset/request'
  method: POST
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      { "error": "La recuperación de contraseña no está disponible." }
