$kind: http-example
request:
  url: '{{baseUrl}}/auth/password'
  method: POST
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      { "error": "Sesión no iniciada o expirada." }
