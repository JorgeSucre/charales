$kind: http-request
name: 'POST /auth/password-reset/confirm (token inválido)'
method: POST
url: '{{baseUrl}}/auth/password-reset/confirm'
order: 10000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "token-inexistente",
      "newPassword": "{{tempPassword}}"
    }
examples: './.resources/Reset-confirm.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 con el mensaje genérico', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.eql('El enlace no es válido o ya expiró.');
      });
