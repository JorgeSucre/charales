$kind: http-request
name: 'POST /auth/password (restaurar)'
method: POST
url: '{{baseUrl}}/auth/password'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{tempPassword}}",
      "newPassword": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('204: se restaura la contraseña de desarrollo', () => pm.response.to.have.status(204));
