$kind: http-request
name: 'POST /auth/password (anónimo)'
method: POST
url: '{{baseUrl}}/auth/password'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{password}}",
      "newPassword": "{{tempPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('401 sin sesión', () => {
        pm.response.to.have.status(401);
        pm.expect(pm.response.json().error).to.eql('Sesión no iniciada o expirada.');
      });
