$kind: http-request
name: 'POST /auth/password'
method: POST
url: '{{baseUrl}}/auth/password'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{password}}",
      "newPassword": "{{tempPassword}}"
    }
examples: './.resources/Change-password.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('204: contraseña cambiada', () => pm.response.to.have.status(204));
