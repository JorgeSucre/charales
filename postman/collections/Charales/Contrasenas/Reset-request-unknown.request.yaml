$kind: http-request
name: 'POST /auth/password-reset/request (correo inexistente)'
method: POST
url: '{{baseUrl}}/auth/password-reset/request'
order: 9000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "nadie@example.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('misma respuesta que para un correo existente (sin enumeración, D7)', () => {
        pm.expect(String(pm.response.code)).to.eql(pm.collectionVariables.get('resetStatusExisting'));
        pm.expect(pm.response.text()).to.eql(pm.collectionVariables.get('resetBodyExisting'));
      });
