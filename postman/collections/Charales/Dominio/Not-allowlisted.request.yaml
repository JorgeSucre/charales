$kind: http-request
name: 'POST /api/rpc fuera de la lista blanca'
method: POST
url: '{{baseUrl}}/api/rpc'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "service": "UserService", "method": "profileAccount", "args": ["x@example.com"] }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('404: sólo se exponen los métodos de rpc-methods.ts', () => {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().error).to.eql('Esa operación no está disponible.');
      });
