$kind: http-request
name: 'POST /auth/login (administrador)'
method: POST
url: '{{baseUrl}}/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "email": "{{adminEmail}}", "password": "{{password}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 (el cookie jar guarda la cookie)', () => pm.response.to.have.status(200));
