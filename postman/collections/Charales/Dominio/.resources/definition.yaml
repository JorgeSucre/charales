description: |-
  Operaciones de dominio (docs/API.md § Operaciones de dominio, decisión D13): `POST /api/rpc` ejecuta en la API el
  servicio de dominio de la lista blanca, con la sesión de la cookie, sobre MariaDB. Sólo lecturas y rechazos (las
